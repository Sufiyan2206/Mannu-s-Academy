<title>Mannu’s Tuition Academy</title>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f5f8; --card:#fff; --ink:#161f2c; --mute:#5d6b7e; --line:#dfe4ec; --brand:#1c2b45; --brand-ink:#fff;
  --chem:#0e9a86; --phys:#3f5bd8; --math:#d98410; --ok:#17803d; --warn:#b45309; --bad:#c0392b;
  --ok-bg:#e3f4ea; --warn-bg:#fdf0dc; --bad-bg:#fbe7e4; --info-bg:#e8edfb; --r:14px;
  --nav-h:62px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1520;--card:#18212f;--ink:#e8edf5;--mute:#93a1b5;--line:#2a3547;--brand:#2d4472;--ok-bg:#12301f;--warn-bg:#3a2a10;--bad-bg:#3b1a17;--info-bg:#1b2747;--ok:#58c47f;--warn:#f0b35a;--bad:#ff8a7a}}
:root[data-theme="dark"]{--bg:#0f1520;--card:#18212f;--ink:#e8edf5;--mute:#93a1b5;--line:#2a3547;--brand:#2d4472;--ok-bg:#12301f;--warn-bg:#3a2a10;--bad-bg:#3b1a17;--info-bg:#1b2747;--ok:#58c47f;--warn:#f0b35a;--bad:#ff8a7a}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 'Schibsted Grotesk',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom))}
h1,h2,h3{margin:0;line-height:1.2}
h1{font-size:1.5rem;font-weight:800;letter-spacing:-.01em} h2{font-size:1.1rem;font-weight:700} h3{font-size:1rem;font-weight:700}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid #7aa2ff;outline-offset:2px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--brand);color:var(--brand-ink);display:flex;align-items:center;gap:10px;padding:10px 16px}
.top .logo{width:34px;height:34px;border-radius:9px;background:#fff;display:grid;place-items:center;flex:none}.top .logo img{display:block;width:30px;height:auto}.top .logo img{display:block;width:30px;height:auto}
.brandlogo{display:block;width:min(100%,280px);height:auto;margin:0 auto}
.top .title{font-weight:700;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top button{background:rgba(255,255,255,.14);border:0;color:#fff;border-radius:999px;padding:7px 12px;font-size:.88rem;cursor:pointer}
main{max-width:980px;margin:0 auto;padding:16px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);display:flex;overflow-x:auto;padding-bottom:env(safe-area-inset-bottom);scrollbar-width:none}
nav.tabs a{flex:1 0 74px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 6px;font-size:.72rem;text-decoration:none;color:var(--mute);min-height:var(--nav-h);justify-content:center}
nav.tabs a svg{width:22px;height:22px}
nav.tabs a[aria-current=page]{color:var(--brand);font-weight:700}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) nav.tabs a[aria-current=page]{color:#9db8f5}}
@media(min-width:900px){
  body{padding-bottom:0;padding-left:200px}
  nav.tabs{top:calc(55px + env(safe-area-inset-top,0px));bottom:0;right:auto;width:200px;flex-direction:column;border-top:0;border-right:1px solid var(--line);padding:12px 8px;overflow:visible}
  nav.tabs a{flex:none;flex-direction:row;gap:10px;font-size:.95rem;padding:10px 12px;min-height:0;justify-content:flex-start;border-radius:10px}
  nav.tabs a[aria-current=page]{background:var(--info-bg)}
  .top{position:fixed;left:0;right:0;top:env(safe-area-inset-top,0px)} body{padding-top:55px}
}
.row{display:flex;gap:10px;align-items:center}.row.wrap{flex-wrap:wrap}.grow{flex:1;min-width:0}.between{justify-content:space-between}
.stack>*+*{margin-top:12px}.mt{margin-top:16px}.mute{color:var(--mute)}.small{font-size:.86rem}.right{text-align:right}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:4px 0 14px;flex-wrap:wrap}
.sec{margin:22px 0 10px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:700px){.stats{grid-template-columns:repeat(4,1fr)}}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;text-decoration:none;display:block}
.stat b{display:block;font-size:1.6rem;font-weight:800;letter-spacing:-.02em;line-height:1.15}
.stat span{color:var(--mute);font-size:.85rem}.stat small{display:block;color:var(--mute);font-size:.78rem;margin-top:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:9px 14px;font-weight:600;cursor:pointer;text-decoration:none;min-height:42px;font-size:.93rem}
.btn.primary{background:var(--brand);color:#fff;border-color:var(--brand)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{min-height:34px;padding:5px 11px;font-size:.84rem}
.btn[disabled]{opacity:.55;cursor:wait}
.chip{display:inline-block;border-radius:999px;padding:2px 10px;font-size:.78rem;font-weight:600;background:var(--info-bg);white-space:nowrap}
.chip.ok{background:var(--ok-bg);color:var(--ok)}.chip.warn{background:var(--warn-bg);color:var(--warn)}.chip.bad{background:var(--bad-bg);color:var(--bad)}.chip.plain{background:transparent;border:1px solid var(--line);color:var(--mute)}
.alert{border-radius:12px;padding:10px 14px;background:var(--warn-bg);color:var(--warn);font-size:.92rem;display:flex;gap:10px;align-items:center;justify-content:space-between;margin-bottom:10px;text-decoration:none}
.alert.bad{background:var(--bad-bg);color:var(--bad)}.alert.info{background:var(--info-bg);color:var(--ink)}

.cls{display:flex;background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:10px}
.cls .bar{width:7px;flex:none;background:var(--c,var(--brand))}
.cls .time{width:76px;flex:none;padding:12px 0 12px 12px}
.cls .time b{display:block;font-size:1.25rem;font-weight:800;letter-spacing:-.02em;line-height:1.1}.cls .time span{font-size:.78rem;color:var(--mute)}
.cls .body{padding:12px 12px 12px 6px;flex:1;min-width:0}
.cls .body h3{font-size:1rem}.cls .meta{color:var(--mute);font-size:.86rem;margin-top:2px}
.cls .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.cls.cancelled{opacity:.6}.cls.cancelled h3{text-decoration:line-through}
.sub-Chemistry{--c:var(--chem)}.sub-Physics{--c:var(--phys)}.sub-Mathematics{--c:var(--math)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--c,var(--mute));margin-right:5px}
.list>div{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}.list>div:last-child{border-bottom:0}
.list .tap{cursor:pointer}
label{display:block;font-size:.86rem;font-weight:600;margin-bottom:4px}
input,select,textarea{width:100%;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 12px;min-height:44px}
textarea{min-height:84px;resize:vertical}
input[type=checkbox],input[type=radio]{width:auto;min-height:0;accent-color:var(--brand)}
.field{margin-bottom:12px}.two{display:grid;grid-template-columns:1fr;gap:0 12px}@media(min-width:560px){.two{grid-template-columns:1fr 1fr}}
.checks{display:flex;flex-wrap:wrap;gap:8px}.checks label{display:flex;gap:7px;align-items:center;border:1px solid var(--line);border-radius:999px;padding:7px 13px;margin:0;font-weight:500;cursor:pointer}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}@media(min-width:700px){.filters{grid-template-columns:repeat(4,1fr)}}
.filters .wide{grid-column:1/-1}@media(min-width:700px){.filters .wide{grid-column:span 2}}
.seg.scroll{overflow-x:auto;flex-wrap:nowrap;-webkit-overflow-scrolling:touch}.seg.scroll button{flex:0 0 auto;padding:8px 14px}.chip.sched{background:var(--info-bg);color:var(--brand)}
table.cmp th,table.cmp td{padding:10px 8px;text-align:center;vertical-align:middle}table.cmp th:first-child,table.cmp td:first-child{text-align:left;padding-left:14px}table.cmp td:first-child{white-space:normal;min-width:120px;max-width:200px}table.cmp th,table.cmp td{padding-left:6px;padding-right:6px}table.cmp th:first-child,table.cmp td:first-child{padding-left:14px}table.cmp td .mute{font-weight:400}
.filters>div{min-width:0}.filters input[type=date]{min-width:0;max-width:100%}
.seg.wrapseg{flex-wrap:wrap;gap:4px;padding:4px}.seg.wrapseg button{flex:1 0 30%;padding:8px 6px;font-size:.9rem}

.fdet{margin:10px 0;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:0 14px}.fdet summary{padding:13px 0;font-weight:600;cursor:pointer;min-height:44px}.fdet[open] summary{border-bottom:1px solid var(--line);margin-bottom:6px}.fdet .filters{padding-bottom:14px}

.seg{display:flex;background:var(--line);border-radius:10px;padding:3px;gap:3px;margin-bottom:14px}.seg button{flex:1;border:0;background:transparent;border-radius:8px;padding:8px;font-weight:600;cursor:pointer;color:var(--mute)}.seg button[aria-pressed=true]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--card)}

.pct{display:inline-flex;align-items:center;gap:8px;min-width:110px}.pct i{display:block;height:6px;border-radius:3px;background:var(--line);flex:1;overflow:hidden}.pct i b{display:block;height:100%;background:var(--ok)}.pct i.low b{background:var(--bad)}.pct i.mid b{background:var(--warn)}
.modal-root{position:fixed;inset:0;z-index:50;background:rgba(10,16,28,.55);display:flex;align-items:flex-end;justify-content:center}
.modal{background:var(--card);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}

.modal .foot{display:flex;gap:10px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}

.toast.err{background:#8e2a20}
@media(min-width:900px){.toast{bottom:24px}}
.empty{text-align:center;color:var(--mute);padding:28px 12px;border:1.5px dashed var(--line);border-radius:var(--r)}
.login{min-height:100vh;display:grid;place-items:center;padding:20px}.login .card{width:100%;max-width:400px;padding:24px}
.receipt{border:1.5px solid var(--ink);border-radius:8px;padding:18px}.receipt .big{font-size:1.7rem;font-weight:800}
.kv{display:grid;grid-template-columns:120px 1fr;gap:6px 12px;font-size:.93rem}.kv dt{color:var(--mute)}.kv dd{margin:0}
.copy{font-family:ui-monospace,Menlo,monospace;font-size:.8rem;word-break:break-all;background:var(--bg);border-radius:8px;padding:8px 10px}
.spin{padding:40px;text-align:center;color:var(--mute)}

// ---------- domain helpers ----------
const enrolled = c => S.core.students.filter(s => s.active && s.batch_id === c.batch_id && s.subjects.includes(c.subject_id));
const endIso = c => new Date(new Date(c.start_at).getTime() + c.duration_min * 60000).toISOString();
const attRec = c => S.att[monthOf(c.start_at)]?.records[c.id];
const announced = c => S.msgs.some(m => m.class_id === c.id && (m.kind === 'class_info' || m.kind === 'class_change'));
const cstate = c => c.status === 'cancelled' ? 'cancelled' : Date.now() > new Date(endIso(c)) ? 'ended' : Date.now() >= new Date(c.start_at) ? 'live' : 'upcoming';
const classMonths = list => [...new Set(list.map(c => monthOf(c.start_at)))];
async function classesIn(from, to, filter = () => true) { const l = S.classes.filter(c => c.start_at >= from && c.start_at < to && filter(c)).sort((a, b) => a.start_at.localeCompare(b.start_at)); await ensureAtt(classMonths(l)); return l; }

function classCard(c, showDate) {
  const st = cstate(c), a = attRec(c), taken = !!a?.taken_at;
  const present = taken ? Object.values(a.rows).filter(r => r.status === 'present' || r.status === 'late').length : 0;
  const chip = st === 'cancelled' ? '<span class="chip bad">Cancelled</span>' : st === 'live' ? '<span class="chip ok">In progress</span>' : st === 'ended' ? (taken ? `<span class="chip ok">Attendance ${present}/${Object.keys(a.rows).length}</span>` : '<span class="chip warn">Attendance needed</span>') : (announced(c) ? '<span class="chip ok">Announced</span>' : '<span class="chip warn">Not announced</span>');
  return `<div class="cls sub-${esc(subj(c.subject_id))} ${st === 'cancelled' ? 'cancelled' : ''}"><div class="bar"></div><div class="time"><b>${fTime(c.start_at)}</b><span>${showDate ? fDate(c.start_at) : 'to ' + fTime(endIso(c))}</span></div>
  <div class="body"><div class="row between wrap"><h3>${esc(subj(c.subject_id))}</h3>${chip}</div><div class="meta">${esc(bname(c.batch_id))} · ${esc(c.teacher_name || 'No teacher')}${showDate ? ' · to ' + fTime(endIso(c)) : ''}</div>
  <div class="acts">${st === 'upcoming' || st === 'live' ? `<a class="btn sm" href="${esc(c.join_url)}" target="_blank" rel="noopener">Open Zoom link</a>` : ''}${st === 'upcoming' && !announced(c) ? `<button class="btn sm" data-act="notify" data-id="${c.id}">Send details</button>` : ''}<a class="btn sm" href="#/class/${c.id}" data-go="class" data-arg="${c.id}">${st === 'ended' ? 'Attendance' : 'Manage'}</a></div></div></div>`;
}
act.notify = d => classMessageModal(d.id, 'class_info');

// ---------- WhatsApp (click-to-chat outbox) ----------
function msgText(kind, v) {
  const A = cfg().academy;
  return ({
    resource_shared: `*${A}*\nNew ${v.subject} study material for ${v.student}\nTitle: ${v.title}\nType: ${v.kind}${v.topic ? '\nTopic: ' + v.topic : ''}${v.instructions ? '\nInstructions: ' + v.instructions : ''}\nOpen: ${v.link}`,
    class_info: `*${A}*\nClass details for ${v.student}\nSubject: ${v.subject}\nDate: ${v.date}\nTime: ${v.time}\nTeacher: ${v.teacher}\nZoom link: ${v.link}`,
    class_reminder: `*${A}* reminder\n${v.student}'s ${v.subject} class starts ${v.date} at ${v.time}.\nTeacher: ${v.teacher}\nZoom link: ${v.link}`,
    class_change: `*${A}*\nSchedule change for ${v.student}'s ${v.subject} class.\nNew date: ${v.date}\nNew time: ${v.time}\nTeacher: ${v.teacher}\nZoom link: ${v.link}`,
    class_cancel: `*${A}*\n${v.student}'s ${v.subject} class on ${v.date} at ${v.time} is cancelled.${v.reason ? '\nReason: ' + v.reason : ''}`,
    fee_reminder: `*${A}*\nFee reminder for ${v.student}.\n${v.note}\nAmount outstanding: ${v.amount}${v.contact ? '\nContact: ' + v.contact : ''}`,
    announcement: `*${A}*\nMessage regarding ${v.student}:\n${v.text}`
  })[kind];
}
function recipients(s, to) { const r = []; if (to !== 'parents') r.push({ role: 'student', name: s.name, number: s.mobile }); if (to !== 'students') r.push({ role: 'guardian', name: s.guardian_name, number: s.guardian_mobile }); return r; }
function classVars(c, s) { return { student: s.name, subject: subj(c.subject_id), date: fDate(c.start_at), time: `${fTime(c.start_at)} – ${fTime(endIso(c))}`, teacher: c.teacher_name ? c.teacher_name + (c.teacher_phone ? ` (${c.teacher_phone})` : '') : 'To be announced', link: c.join_url, reason: c.cancel_reason }; }
let logTimer;
function logMsg(m) { S.msgs.push({ id: uid(), ts: new Date().toISOString(), by: ME?.name || (isAdmin() ? 'Admin' : 'Teacher'), status: 'sent', ...m }); clearTimeout(logTimer); logTimer = setTimeout(() => saveMsgs().catch(e => toast('Could not save the message log', true)), 700); }
// items: [{kind, student_id, class_id, role, name, number, text}]
function outbox(title, items) {
  const ok = items.filter(i => waNum(i.number)), bad = items.length - ok.length;
  modal(title, `<p class="mute small">Each message opens in WhatsApp with the text filled in. Tap <b>Send</b>, then press send in WhatsApp. Tapped messages are recorded in the log as sent by staff.</p>
  ${bad ? `<div class="alert">${bad} recipient${bad > 1 ? 's' : ''} skipped: no valid WhatsApp number.</div>` : ''}
  ${ok.length ? `<div class="list">${ok.map((i, n) => `<div id="o${n}"><div class="grow"><b>${esc(i.name)}</b> <span class="mute small">(${i.role === 'guardian' ? 'parent of ' + esc(sname(i.student_id)) : 'student'})</span><div class="mute small">${esc(i.number)}</div></div><span class="chip ok" hidden>Opened</span><button class="btn sm" data-copy="${n}">Copy</button><a class="btn sm primary" data-n="${n}" target="_blank" rel="noopener" href="https://wa.me/${waNum(i.number)}?text=${encodeURIComponent(i.text)}">Send</a></div>`).join('')}</div>` : '<div class="empty">No one to message.</div>'}
  <details class="small mt"><summary class="mute" style="cursor:pointer">Preview message</summary><div style="white-space:pre-wrap;margin-top:6px">${esc(ok[0]?.text || '')}</div></details>`, root => {
    root.querySelectorAll('a[data-n]').forEach(a => a.addEventListener('click', () => { const i = ok[+a.dataset.n]; logMsg({ kind: i.kind, student_id: i.student_id, class_id: i.class_id, recipient_role: i.role, recipient_name: i.name, to_number: i.number, body: i.text }); const row = root.querySelector('#o' + a.dataset.n); row.querySelector('.chip').hidden = false; a.textContent = 'Send again'; a.classList.remove('primary'); }));
    root.querySelectorAll('[data-copy]').forEach(b => b.onclick = () => act.copy({ text: ok[+b.dataset.copy].text }));
  });
}
function classMessageModal(id, kind) {
  const c = S.classes.find(x => x.id === id);
  formModal('Message students on WhatsApp', field('Message', `<select name="kind"><option value="class_info">Class details (subject, time, teacher, Zoom link)</option><option value="class_reminder">Class reminder</option><option value="class_change">Schedule change</option><option value="class_cancel">Cancellation</option></select>`) + field('Send to', `<select name="to"><option value="both">Students and parents</option><option value="students">Students only</option><option value="parents">Parents only</option></select>`) + `<p class="mute small">Goes to every student enrolled in ${esc(bname(c.batch_id))} for ${esc(subj(c.subject_id))}.</p>`, 'Prepare messages',
    async (f, close) => { close(); const k = f.kind.value; outbox('Class message', enrolled(c).flatMap(s => recipients(s, f.to.value).map(r => ({ kind: k, student_id: s.id, class_id: c.id, ...r, text: msgText(k, classVars(c, s)) })))); }, f => { f.kind.value = kind; });
}

// ---------- fees engine ----------
function feeStatus(sid) {
  const today = todayStr(), soon = addDays(today, 7);
  const ch = S.fees.charges.filter(c => c.student_id === sid && !c.voided).sort((a, b) => a.due_date.localeCompare(b.due_date) || a.created_at.localeCompare(b.created_at));
  const pay = S.fees.payments.filter(p => p.student_id === sid && !p.voided);
  let pool = pay.reduce((t, p) => t + p.cents, 0); const paid = pool; let overdue = 0, upcoming = 0, charged = 0, next = null;
  const lines = ch.map(c => { charged += c.cents; const ap = Math.min(pool, c.cents); pool -= ap; const out = c.cents - ap; const od = out > 0 && c.due_date < today; if (out > 0) { if (od) overdue += out; else { if (c.due_date <= soon) upcoming += out; if (!next) next = c.due_date; } } return { ...c, out, od }; });
  return { lines, charged, paid, balance: charged - paid, overdue, upcoming, next, cur: scur(S.core.students.find(x => x.id === sid)) };
}
const rateFor = (s, subId) => S.fees.rates.filter(r => r.subject_id === subId && curOf(r) === scur(s) && (!r.student_id || r.student_id === s.id) && (!r.batch_id || r.batch_id === s.batch_id)).sort((a, b) => ((b.student_id ? 2 : 0) + (b.batch_id ? 1 : 0)) - ((a.student_id ? 2 : 0) + (a.batch_id ? 1 : 0)))[0];

// ---------- dashboard ----------
async function vDash() {
  const m = $('#main'), t = todayStr(), [from, to] = dayRange(t), week = dayRange(addDays(t, 7))[0];
  const today = await classesIn(from, to), up = await classesIn(new Date().toISOString(), week, c => c.status === 'scheduled');
  const prevDays = S.classes.filter(c => c.status === 'scheduled' && endIso(c) < new Date().toISOString() && endIso(c) > new Date(Date.now() - 30 * 864e5).toISOString()); await ensureAtt(classMonths(prevDays));
  const pending = prevDays.filter(c => !attRec(c)?.taken_at).length;
  let p = 0, n = 0; today.filter(c => c.status === 'scheduled').forEach(c => { const a = attRec(c); if (a?.taken_at) { const r = Object.values(a.rows); n += r.length; p += r.filter(x => x.status === 'present' || x.status === 'late').length; } });
  let fees = null; if (isAdmin()) { const rows = S.core.students.filter(s => s.active).map(s => { const f = feeStatus(s.id); return { cur: f.cur, bal: f.balance, od: f.overdue }; }); fees = { bal: sumBy(rows, 'bal'), od: sumBy(rows, 'od'), owing: rows.filter(r => r.bal > 0).length }; }
  const mine = mark => mark ? '' : '';
  m.innerHTML = `${LOCAL ? '<div class="alert info">Saved on this device only. Open the published artifact signed in to share records with your team.</div>' : ''}
  <div class="head"><div><h1>${new Intl.DateTimeFormat('en-GB', { timeZone: tz(), weekday: 'long', day: 'numeric', month: 'long' }).format(new Date())}</h1><div class="mute">${isAdmin() ? 'Academy overview' : 'Teacher view'}</div></div><button class="btn primary" id="sc">Schedule class</button></div>
  ${!S.core.batches.length ? `<div class="alert info"><span><b>Start here:</b> add a batch and your students.</span><a href="#/students" data-go="students">Open Students</a></div>` : ''}

function feeReminderItems(ids, kind, to) {
  const out = []; for (const s of S.core.students.filter(x => x.active && (!ids || ids.includes(x.id)))) {
    const f = feeStatus(s.id); if (f.balance <= 0 || (kind === 'overdue' && f.overdue <= 0) || (kind === 'upcoming' && f.upcoming <= 0) || (kind === 'any' && f.overdue <= 0 && f.upcoming <= 0)) continue;
    const parts = []; if (f.overdue > 0) parts.push(`${money(f.overdue, f.cur)} is overdue.`); if (f.upcoming > 0) parts.push(`${money(f.upcoming, f.cur)} is due by ${fDateY(addDays(todayStr(), 7) + 'T12:00:00Z')}.`);
    const text = msgText('fee_reminder', { student: s.name, note: parts.join(' ') || 'A balance is pending.', amount: money(f.balance, f.cur), contact: cfg().contact });
    recipients(s, to).forEach(r => out.push({ kind: 'fee_reminder', student_id: s.id, class_id: null, ...r, text }));
  } return out;
}
async function generateFees(period, dueDay) {
  if (!/^\d{4}-\d{2}$/.test(period)) throw new Error('Choose a month.'); const day = Math.min(28, Math.max(1, Number(dueDay) || 10)), due = `${period}-${String(day).padStart(2, '0')}`;
  const label = new Date(period + '-01T00:00:00Z').toLocaleString('en-GB', { month: 'long', year: 'numeric', timeZone: 'UTC' }); let created = 0, skipped = 0; const none = [], added = [];
  for (const s of S.core.students.filter(x => x.active)) for (const sid of s.subjects) {
    const r = rateFor(s, sid); if (!r) { none.push(`${s.name} (${subj(sid)}, ${scur(s)})`); continue; } if (r.cents === 0) continue;
    if (S.fees.charges.some(c => c.student_id === s.id && c.subject_id === sid && c.period === period && !c.voided)) { skipped++; continue; }
    const ch = { id: uid(), student_id: s.id, subject_id: sid, period, description: `${subj(sid)} fee – ${label}`, currency: scur(s), cents: r.cents, due_date: due, voided: false, created_at: new Date().toISOString() }; S.fees.charges.push(ch); added.push(ch); created++;
  }
  try { await persist(saveFees); } catch (e) { S.fees.charges = S.fees.charges.filter(c => !added.includes(c)); throw e; }
  toast(`${created} charges created${skipped ? `, ${skipped} already existed` : ''}`); if (none.length) modal('No fee rate set', `<p>These student subjects have no rate in the student’s fee currency, so nothing was charged:</p><div class="card small">${none.map(esc).join('<br>')}</div>`);
}

function feeStudentModal(id, done) {
  const s = S.core.students.find(x => x.id === id), f = feeStatus(id), pays = S.fees.payments.filter(p => p.student_id === id).sort((a, b) => b.paid_at.localeCompare(a.paid_at));
  modal(s.name, `<div class="stats" style="grid-template-columns:repeat(2,1fr)"><div class="stat"><b>${money(Math.max(0, f.balance), f.cur)}</b><span>Outstanding</span>${f.balance < 0 ? `<small>Credit ${money(-f.balance, f.cur)}</small>` : ''}</div><div class="stat"><b>${money(f.overdue, f.cur)}</b><span>Overdue</span></div></div>
  <div class="sec"><h3>Charges</h3></div>${f.lines.length ? `<div class="list">${f.lines.slice().reverse().map(c => `<div><div class="grow">${esc(c.description)}<div class="mute small">Due ${fDateY(c.due_date + 'T12:00:00Z')}</div></div><div class="right">${money(c.cents, f.cur)}<div>${c.out <= 0 ? '<span class="chip ok">Paid</span>' : `<span class="chip ${c.od ? 'bad' : 'warn'}">${money(c.out, f.cur)} ${c.od ? 'overdue' : 'due'}</span>`}</div></div><button class="btn sm" data-act="void" data-id="${c.id}" aria-label="Void charge">✕</button></div>`).join('')}</div>` : '<div class="mute">No charges yet.</div>'}
  <div class="sec"><h3>Payments</h3></div>${pays.length ? `<div class="list">${pays.map(p => `<div class="tap" data-act="receipt2" data-id="${p.id}"><div class="grow">${fDateY(p.paid_at)} · ${METHOD[p.method]}<div class="mute small">${p.receipt_no}</div></div><div class="right">${money(p.paid_cents ?? p.cents, p.paid_currency || curOf(p))}${p.paid_currency && p.paid_currency !== curOf(p) ? `<div class="mute small">= ${money(p.cents, f.cur)}</div>` : ''}${p.voided ? '<div><span class="chip bad">Voided</span></div>' : ''}</div></div>`).join('')}</div>` : '<div class="mute">No payments yet.</div>'}
  <div class="foot"><button class="btn" id="ac">Add charge</button><button class="btn" id="rm">Send reminder</button><button class="btn primary" id="rp">Record payment</button></div>`, (root, close) => {
    root.querySelector('#rp').onclick = () => { close(); paymentModal(id, done); };
    root.querySelector('#rm').onclick = () => { const it = feeReminderItems([id], 'any', 'parents'); if (!it.length) return toast('Nothing is due or overdue for this student'); close(); outbox('Fee reminder', it); };
    root.querySelector('#ac').onclick = () => { close(); formModal('Add charge', field('Description', '<input name="d" placeholder="e.g. Admission fee, exam fee">') + `<div class="two">${field(`Amount (${f.cur})`, '<input name="a" type="number" inputmode="decimal" min="0" step="0.01">')}${field('Due date', `<input name="due" type="date" value="${todayStr()}">`)}</div>`, 'Add charge', async (ff, c) => { if (!ff.d.value.trim()) throw new Error('Describe the charge.'); if (!(Number(ff.a.value) > 0)) throw new Error('Enter an amount greater than zero.'); if (!ff.due.value) throw new Error('Choose a due date.'); const ch = { id: uid(), student_id: id, subject_id: null, period: null, description: ff.d.value.trim(), currency: f.cur, cents: toMinor(ff.a.value, f.cur), due_date: ff.due.value, voided: false, created_at: new Date().toISOString() }; S.fees.charges.push(ch); try { await persist(saveFees); } catch (e) { S.fees.charges.pop(); throw e; } c(); toast('Charge added'); done && done(); }); };
    act.receipt2 = d => { close(); receiptModal(d.id, done); };
    act.void = d => { close(); confirmBox('Void charge', 'Void this charge? It will no longer count toward the balance.', 'Void charge', async () => { const ch = S.fees.charges.find(x => x.id === d.id); ch.voided = true; try { await persist(saveFees); } catch (e) { ch.voided = false; throw e; } toast('Charge voided'); done && done(); }); };
  });
}

// ---------- messages ----------
async function vMessages() {
  const m = $('#main');
  m.innerHTML = `<div class="head"><h1>WhatsApp messages</h1><button class="btn primary" id="an">New announcement</button></div><div class="alert info">Messages open in WhatsApp for staff to send. The log records who opened each one; WhatsApp does not report delivery back to this page.</div><div id="res"></div>`;
  const rows = S.msgs.slice().reverse().filter(x => isAdmin() || !['fee_reminder', 'receipt'].includes(x.kind)).slice(0, 200);
  $('#res').innerHTML = rows.length ? `<div class="card list">${rows.map(x => `<div style="align-items:flex-start"><div class="grow"><b>${esc(KIND[x.kind] || x.kind)}</b> · ${esc(x.recipient_name)} <span class="mute">(${x.recipient_role === 'guardian' ? 'parent' : 'student'}${x.recipient_role === 'guardian' && x.student_id ? ' of ' + esc(sname(x.student_id)) : ''})</span><div class="mute small">${fDT(x.ts)} · ${esc(x.by)}</div><details class="small"><summary class="mute" style="cursor:pointer">Show message</summary><div style="white-space:pre-wrap;margin-top:4px">${esc(x.body)}</div></details></div><span class="chip">Opened by staff</span></div>`).join('')}</div>` : '<div class="empty">No messages sent yet.</div>';
  $('#an').onclick = () => formModal('New announcement', `<div class="two">${field('Batch', `<select name="b">${opts(S.core.batches, '', isAdmin() ? 'All batches' : 'Choose a batch')}</select>`)}${field('Subject', `<select name="s">${opts(SUBJECTS, '', 'All subjects')}</select>`)}</div>` + field('Send to', '<select name="to"><option value="both">Students and parents</option><option value="students">Students only</option><option value="parents">Parents only</option></select>') + field('Message', '<textarea name="t" maxlength="600" placeholder="e.g. Tomorrow’s test will cover chapters 4 and 5."></textarea>'), 'Prepare messages', async (f, close) => {

function momentsModal(sample, f) {
  modal('Find key moments', `<div class="stack"><p class="small mute" style="margin:0">Paste the class transcript (for example from YouTube or Zoom, with times like “12:30”). Claude suggests explanations, formulas, exam tips and worked steps. Student names, phone numbers and emails are removed first, and the text is sent to Claude.</p><textarea id="tx" rows="8" placeholder="0:00 Today we study alkenes…" aria-label="Transcript"></textarea><button class="btn primary" id="go">Suggest moments</button><div id="out"></div></div>`, (root, close) => {
    root.querySelector('#go').onclick = e => run(e.target, async () => {
      const raw = root.querySelector('#tx').value.trim(); if (raw.length < 80) throw new Error('Paste a longer transcript.'); const clean = redactT(raw.slice(0, 60000)).text;
      const out = await sample.json(`You help a tuition academy cut short vertical educational clips (Instagram Reels) from a recorded class. From the transcript below pick up to 5 moments that work as standalone 20-60 second clips: "explanation" (a clear explanation of a key concept), "formula" (a formula or definition stated), "tip" (an exam tip or common mistake) or "problem_solving" (a worked problem step). Each must start at the beginning of a sentence, must not overlap another, be understandable alone, and avoid conversation with students. Times in the transcript are m:ss or h:mm:ss; answer in seconds from the start of the class. Reply ONLY with a JSON array: [{"start": seconds, "end": seconds, "type": "explanation|formula|tip|problem_solving", "title": "max 60 characters", "reason": "one sentence"}].\nSubject: ${subj(f.sub.value) || 'unknown'}\nTopic: ${f.topic.value || 'not given'}\n\nTranscript:\n${clean}`);
      const clips = (Array.isArray(out) ? out : []).map(c => ({ start: Math.max(0, +c.start), end: +c.end, type: RTYPE[c.type] ? c.type : 'explanation', title: String(c.title || 'Key moment').slice(0, 70), reason: String(c.reason || '').slice(0, 200) })).filter(c => c.end > c.start && c.end - c.start >= 8).map(c => ({ ...c, end: Math.min(c.end, c.start + 90) }));
      root.querySelector('#out').innerHTML = clips.length ? clips.map((c, i) => `<div class="card stack" style="margin-top:8px"><div class="row between"><b>${esc(c.title)}</b><span class="chip">${RTYPE[c.type]}</span></div><div class="small mute">${mmss(c.start)} – ${mmss(c.end)} · ${Math.round(c.end - c.start)} s</div>${c.reason ? `<div class="small">${esc(c.reason)}</div>` : ''}<button class="btn sm primary" data-i="${i}">Use this</button></div>`).join('') + '<div class="small mute" style="margin-top:6px">Suggested by AI. Check each one before using it.</div>' : '<div class="empty">No clear moments found.</div>';
      root.querySelectorAll('[data-i]').forEach(b => b.onclick = () => { const c = clips[+b.dataset.i]; f.ys.value = mmss(c.start); f.len.value = Math.round(c.end - c.start); if (!f.title.value.trim()) f.title.value = c.title; toast('Filled in the start time, length and title'); close(); });
    });
  });
}
